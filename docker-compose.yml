services:

  # ─────────────────────────────────────────────────────────────
  # Qdrant  base de données vectorielle (démarrage automatique)
  # Stockage persistant en bind mount → ./data/qdrant/
  # Survit à `docker compose down -v`, sauvegardable comme un dossier normal.
  # ─────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: ao_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP REST API
      - "6334:6334"   # gRPC
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' 2>/dev/null && exit 0 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - ao_network

  # ─────────────────────────────────────────────────────────────
  # RAG ETL  microservice d'indexation (démarrage manuel)
  #
  # Ce service est séparé du service principal et NE démarre PAS
  # automatiquement avec `docker compose up`.
  #
  # Pour démarrer le service ETL :
  #   docker compose --profile rag up rag-etl
  #
  # Pour déclencher une indexation depuis la ligne de commande :
  #   curl -X POST http://localhost:8001/index
  #
  # Pour déclencher depuis l'interface OffrIA :
  #   Cliquez sur le bouton "Reindexer" dans l'en-tête.
  # ─────────────────────────────────────────────────────────────
  rag-etl:
    build:
      context: rag_service
      dockerfile: Dockerfile
    container_name: ao_rag_etl
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    volumes:
      - ./knowledge_base:/app/knowledge_base   # Documents sources (lecture + manifest)
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8001' 2>/dev/null && exit 0 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ao_network

