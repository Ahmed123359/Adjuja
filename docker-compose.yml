  #   networks:
  #     - ao_network

  # ─────────────────────────────────────────────────────────────
  # Frontend React  commenté, lancé localement via :
  #   cd frontend && npm run dev
  # ─────────────────────────────────────────────────────────────
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
