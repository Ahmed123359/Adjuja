services:

  # ── Infrastructure ───────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: offria
      POSTGRES_USER: offria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offria"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ao_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ao_network

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9010:9000"   # API  (9000 pris par autre app)
      - "9011:9001"   # Console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ao_network

  qdrant:
    image: qdrant/qdrant:v1.12.1
    restart: unless-stopped
    volumes:
      - ./data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' 2>/dev/null && exit 0 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - ao_network

  # ── Backend API ──────────────────────────────────────────────────────────────

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://offria:${POSTGRES_PASSWORD}@postgres:5432/offria
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      QDRANT_URL: http://qdrant:6333
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ao_network

  celery-io:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    restart: unless-stopped
    command: >
      celery -A app.celery_app.celery_app worker
      --queues=celery_io
      --concurrency=4
      --loglevel=info
      --hostname=celery-io@%h
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://offria:${POSTGRES_PASSWORD}@postgres:5432/offria
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      QDRANT_URL: http://qdrant:6333
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - ao_network

  celery-cpu:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    restart: unless-stopped
    command: >
      celery -A app.celery_app.celery_app worker
      --queues=celery_cpu
      --concurrency=2
      --loglevel=info
      --hostname=celery-cpu@%h
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://offria:${POSTGRES_PASSWORD}@postgres:5432/offria
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      QDRANT_URL: http://qdrant:6333
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - ao_network

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    restart: unless-stopped
    command: >
      celery -A app.celery_app.celery_app beat
      --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://offria:${POSTGRES_PASSWORD}@postgres:5432/offria
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      NOTIFICATION_SERVICE_URL: http://notification-api:8002
      NOTIFICATION_ADMIN_SECRET: ${ADMIN_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      notification-api:
        condition: service_started
    networks:
      - ao_network

  # ── Frontend ─────────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8090:80"   # Accès via http://<ip>:8090  (mettre derrière nginx/caddy pour SSL)
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ao_network

  # ── AO Watcher ───────────────────────────────────────────────────────────────

  ao-watcher-api:
    build:
      context: ./ao-watcher
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      sh -c "python init_db.py && uvicorn app.main:app --host 0.0.0.0 --port 8001"
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://offria:${POSTGRES_PASSWORD}@postgres:5432/offria
      REDIS_URL: redis://redis:6379/3
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: offria
      MAIN_APP_HOST: api
      MAIN_APP_PORT: 8000
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - ao_network

  ao-watcher-worker:
    build:
      context: ./ao-watcher
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      celery -A app.workers.celery_app.celery_app worker
      --pool=prefork
      --concurrency=2
      --loglevel=info
      --hostname=ao-watcher-worker@%h
    environment:
      DATABASE_URL: postgresql+asyncpg://offria:${POSTGRES_PASSWORD}@postgres:5432/offria
      REDIS_URL: redis://redis:6379/3
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: offria
      NOTIFICATION_SERVICE_URL: http://notification-api:8002
      NOTIFICATION_ADMIN_SECRET: ${ADMIN_SECRET}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      SCRAPER_PROXY: ${SCRAPER_PROXY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      notification-api:
        condition: service_started
    networks:
      - ao_network

  ao-watcher-beat:
    build:
      context: ./ao-watcher
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      celery -A app.workers.celery_app.celery_app beat
      --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://offria:${POSTGRES_PASSWORD}@postgres:5432/offria
      REDIS_URL: redis://redis:6379/3
    depends_on:
      - redis
    networks:
      - ao_network

  # ── Notification Service ──────────────────────────────────────────────────────

  notification-api:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql+asyncpg://offria:${POSTGRES_PASSWORD}@postgres:5432/offria
      REDIS_URL: redis://redis:6379/4
      RESEND_API_KEY: ${RESEND_API_KEY}
      NOTIFICATION_CHANNEL: email_resend
      NOTIFICATION_FROM_EMAIL: ${NOTIFICATION_FROM_EMAIL:-contact@adjuja.com}
      NOTIFICATION_FROM_NAME: ADJUJA Veille
      ADMIN_SECRET: ${ADMIN_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ao_network

  notification-worker:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      celery -A app.workers.celery_app.celery_app worker
      --pool=gevent
      --concurrency=10
      --loglevel=info
      --hostname=notification-worker@%h
    environment:
      DATABASE_URL: postgresql+asyncpg://offria:${POSTGRES_PASSWORD}@postgres:5432/offria
      REDIS_URL: redis://redis:6379/4
      RESEND_API_KEY: ${RESEND_API_KEY}
      NOTIFICATION_CHANNEL: email_resend
      NOTIFICATION_FROM_EMAIL: ${NOTIFICATION_FROM_EMAIL:-contact@adjuja.com}
      NOTIFICATION_FROM_NAME: ADJUJA Veille
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ao_network

  notification-beat:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      celery -A app.workers.celery_app.celery_app beat
      --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://offria:${POSTGRES_PASSWORD}@postgres:5432/offria
      REDIS_URL: redis://redis:6379/4
    depends_on:
      - redis
    networks:
      - ao_network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  ao_network:
    driver: bridge
