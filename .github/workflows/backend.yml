name: Backend

# Deplace depuis adjuja-backend/.github/workflows/ le 2026-09-27 : GitHub ne lit
# que .github/workflows/ a la racine du depot. Depuis le retour a un depot
# unique (2026-09-12), cette CI ne tournait donc plus du tout.
on:
  push:
    branches: ["**"]
    paths:
      - "adjuja-backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "adjuja-backend/**"
      - ".github/workflows/backend.yml"

defaults:
  run:
    working-directory: adjuja-backend

jobs:
  lint:
    name: "Erreurs (ruff)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # Seulement les vraies erreurs : noms non definis, imports et variables
      # inutiles, appels bloquants dans du code asynchrone. Les ~600 remarques
      # de style (ruff check sans --select) ne bloquent pas encore.
      - run: ruff check app/ tests/ --select E9,F,ASYNC

  security:
    name: "Securite (bandit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      # -ll : severite moyenne et haute seulement.
      - run: bandit -r app/ -ll --exclude app/providers/

  test:
    name: "Tests + couverture"
    runs-on: ubuntu-latest
    needs: [lint, security]

    # L'application ouvre sa connexion a la base au demarrage (tests d'integration).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: offria
          POSTGRES_PASSWORD: offria
          POSTGRES_DB: offria
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U offria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      JWT_SECRET_KEY: "ci-github-actions-test-secret-key-not-for-prod"
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://offria:offria@localhost:5432/offria
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      MISTRAL_API_KEY: ""

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: adjuja-backend/requirements.txt
      - run: pip install -r requirements.txt
      # Le schema vient des migrations (plus de create_all au demarrage) : les
      # appliquer ici verifie aussi, a chaque push, que la chaine construit une
      # base complete a partir de rien.
      - run: python -m app.scripts.migrate
      # Seuil de couverture = niveau actuel (34 % le 2026-09-27), pour interdire
      # la regression. L'ancien seuil de 60 % n'a jamais ete tenu : la CI ne
      # tournait pas. A remonter au fil des tests ajoutes.
      - run: pytest tests/ --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=33
