server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Proxy API → FastAPI backend
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Proxy AO Watcher → microservice port 8001
    location /watcher/ {
        proxy_pass http://ao-watcher-api:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Proxy Notification service → microservice port 8002
    location /notifications/ {
        proxy_pass http://notification-api:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Assets Vite (noms hashés par contenu, ex: index-C7fG4du5.js) : cache long, sûr car
    # le nom change à chaque build -- jamais de contenu périmé servi sous un même nom.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # React Router  toujours renvoyer index.html
    location / {
        try_files $uri $uri/ /index.html;

        # index.html référence les noms hashés du build courant : jamais de cache sinon
        # les navigateurs (hors navigation privée) restent bloqués sur un ancien build
        # -- vécu en réel : Google Sign-In cassé indéfiniment en navigation normale alors
        # que l'incognito fonctionnait, car index.html était mis en cache sans en-tête.
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
