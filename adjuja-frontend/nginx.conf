server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Adresses des services resolues A CHAQUE REQUETE par le DNS interne de
    # Docker, pas une seule fois au demarrage de nginx. Avec un nom en dur dans
    # proxy_pass, recreer `api` seul (nouvelle IP) laissait nginx envoyer vers
    # l'ancienne adresse : 502 jusqu'au redemarrage du frontend (vecu en
    # production le 2026-09-27, apres la rotation de JWT_SECRET_KEY). Une
    # variable dans proxy_pass force la resolution par `resolver`.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api          http://api:8000;
    set $watcher      http://ao-watcher-api:8001;
    set $notification http://notification-api:8002;

    # Proxy API → FastAPI backend
    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Proxy AO Watcher → microservice port 8001
    location /watcher/ {
        rewrite ^/watcher/(.*)$ /$1 break;
        proxy_pass $watcher;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Proxy Notification service → microservice port 8002
    location /notifications/ {
        rewrite ^/notifications/(.*)$ /$1 break;
        proxy_pass $notification;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass $api;
        proxy_set_header Host $host;
    }

    # Assets Vite (noms hashés par contenu, ex: index-C7fG4du5.js) : cache long, sûr car
    # le nom change à chaque build -- jamais de contenu périmé servi sous un même nom.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # React Router  toujours renvoyer index.html
    location / {
        try_files $uri $uri/ /index.html;

        # index.html référence les noms hashés du build courant : jamais de cache sinon
        # les navigateurs (hors navigation privée) restent bloqués sur un ancien build
        # -- vécu en réel : Google Sign-In cassé indéfiniment en navigation normale alors
        # que l'incognito fonctionnait, car index.html était mis en cache sans en-tête.
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
