repos:
  # 1. Ruff  lint + imports inutilisés (même config que la CI)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(app|tests)/

  # 2. Bandit  sécurité (même config que la CI : medium+high, exclut providers/)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: [-ll, --exclude, app/providers/]
        files: ^app/

  # 3. Bloque le commit si .env est stagé accidentellement
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: no-commit-to-branch
        args: [--branch, main]

  # 4. pytest  lance les tests (sans couverture pour rester rapide en local)
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest tests/ -v -x
        language: system
        pass_filenames: false
        always_run: true
