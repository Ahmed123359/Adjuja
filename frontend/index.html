<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-logo-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-logo.png" />
    <link rel="apple-touch-icon" href="/favicon-logo.png" />
    <title>ADJUJA L'IA qui remporte vos marchés</title>

    <!-- SEO -->
    <meta
      name="description"
      content="ADJUJA rédige vos réponses à appels d'offres en moins de 2 minutes. Déposez votre DCE, obtenez une réponse complète et professionnelle prête à soumettre. Essai gratuit."
    />
    <meta
      name="keywords"
      content="appel d'offres IA, réponse AO automatique, logiciel marchés publics, générateur appel d'offres, IA rédaction AO"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://adjuja.com" />

    <!-- Open Graph (LinkedIn, WhatsApp, Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://adjuja.com" />
    <meta property="og:title" content="ADJUJA L'IA qui remporte vos marchés" />
    <meta
      property="og:description"
      content="Répondez à 10× plus d'appels d'offres sans y passer vos nuits. ADJUJA analyse votre DCE et rédige une réponse complète en 2 minutes."
    />
    <meta property="og:image" content="https://adjuja.com/og-image.png" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="ADJUJA" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://adjuja.com" />
    <meta
      name="twitter:title"
      content="ADJUJA L'IA qui remporte vos marchés"
    />
    <meta
      name="twitter:description"
      content="Répondez à 10× plus d'appels d'offres sans y passer vos nuits. ADJUJA analyse votre DCE et rédige une réponse complète en 2 minutes."
    />
    <meta name="twitter:image" content="https://adjuja.com/og-image.png" />

    <!-- JSON-LD  Données structurées (Google + LLMs) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "ADJUJA",
        "url": "https://adjuja.com",
        "logo": "https://adjuja.com/og-image.png",
        "description": "ADJUJA est un logiciel SaaS qui génère automatiquement des réponses complètes à des appels d'offres publics grâce à l'intelligence artificielle. Analyse du DCE, rédaction structurée, export Word en moins de 2 minutes.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "offers": [
          {
            "@type": "Offer",
            "name": "Starter",
            "price": "55",
            "priceCurrency": "EUR",
            "priceSpecification": {
              "@type": "UnitPriceSpecification",
              "billingDuration": "P1M"
            },
            "description": "50 AOs générés par mois, 1 utilisateur, export Word"
          },
          {
            "@type": "Offer",
            "name": "Pro",
            "price": "174",
            "priceCurrency": "EUR",
            "priceSpecification": {
              "@type": "UnitPriceSpecification",
              "billingDuration": "P1M"
            },
            "description": "Génération illimitée, 5 utilisateurs, chat avec documents"
          }
        ],
        "featureList": [
          "Génération automatique de réponses AO",
          "Analyse du cahier des charges",
          "Export Word natif (.docx)",
          "Compatible Claude, GPT-4o, Mistral",
          "Signature de documents PDF",
          "Historique des générations",
          "Hébergement européen RGPD"
        ],
        "inLanguage": ["fr", "en"],
        "publisher": {
          "@type": "Organization",
          "name": "ADJUJA",
          "url": "https://adjuja.com"
        }
      }
    </script>

    <!-- JSON-LD  FAQ (boost SEO + GEO) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Combien de temps faut-il pour générer une réponse à un appel d'offres avec ADJUJA ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "ADJUJA génère une réponse complète et structurée en moins de 2 minutes. Il suffit de déposer votre DCE (PDF ou texte) et l'IA analyse le cahier des charges et rédige chaque section en parallèle."
            }
          },
          {
            "@type": "Question",
            "name": "Quels formats de fichiers sont supportés ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "ADJUJA accepte les fichiers PDF (natifs et scannés via OCR) ainsi que le texte brut. Le résultat est exportable en Word (.docx) ou PDF."
            }
          },
          {
            "@type": "Question",
            "name": "Quels modèles d'IA sont utilisés ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "ADJUJA supporte trois providers : Anthropic Claude (meilleur pour la rédaction complexe), OpenAI GPT-4o (polyvalent et rapide) et Mistral (souveraineté européenne des données). Vous choisissez le modèle adapté à chaque AO."
            }
          },
          {
            "@type": "Question",
            "name": "Mes données sont-elles sécurisées ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Oui. ADJUJA est hébergé en Europe, conforme RGPD, et propose une option on-premise pour les entreprises qui ne souhaitent pas que leurs documents quittent leur infrastructure."
            }
          },
          {
            "@type": "Question",
            "name": "Y a-t-il un engagement minimum ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Non. ADJUJA est sans engagement, résiliable à tout moment. Un essai gratuit est disponible sans carte bancaire."
            }
          }
        ]
      }
    </script>

    <!-- Anti-flash : applique le thème avant le premier rendu -->
    <script>
      if (localStorage.getItem("theme") !== "light")
        document.documentElement.classList.add("dark");
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link
      href="https://assets.calendly.com/assets/external/widget.css"
      rel="stylesheet"
    />
    <script
      src="https://assets.calendly.com/assets/external/widget.js"
      async
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
