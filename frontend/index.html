        "operatingSystem": "Web",
        "offers": [
          {
            "@type": "Offer",
            "name": "Essentiel",
            "price": "490",
            "priceCurrency": "MAD",
            "priceSpecification": {
              "@type": "UnitPriceSpecification",
              "billingDuration": "P1M"
            },

          },
          {
            "@type": "Offer",
            "name": "Pro",
            "price": "990",
            "priceCurrency": "MAD",
            "priceSpecification": {
              "@type": "UnitPriceSpecification",
              "billingDuration": "P1M"
            },
            "description": "Génération illimitée, 5 utilisateurs, chat avec documents"
          },
          {
            "@type": "Offer",
            "name": "Cabinet",
            "price": "2900",
            "priceCurrency": "MAD",
            "priceSpecification": {
              "@type": "UnitPriceSpecification",
              "billingDuration": "P1M"
            },
            "description": "Utilisateurs illimités, SLA garanti, accompagnement dédié"
          }
        ],
        "featureList": [
          "Veille des appels d'offres publics marocains",
          "Analyse d'opportunité du cahier des prescriptions spéciales",
          "Rédaction assistée de la réponse technique",
          "Export Word natif (.docx)",
          "Signature électronique de documents",
          "Historique des générations",
          "Conforme à la loi 09-08 sur la protection des données personnelles"
        ],
        "inLanguage": ["fr", "en"],

    <!-- JSON-LD  FAQ (boost SEO + GEO) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Combien de temps faut-il pour analyser un appel d'offres avec ADJUJA ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "ADJUJA analyse votre CPS en quelques minutes et prépare une base de réponse structurée. Il suffit de déposer votre DAO (PDF ou texte) : l'IA extrait les critères, les délais et les pièces exigées, puis rédige chaque section en parallèle. Vous gardez la main sur la relecture et la décision finale."
            }
          },
          {
            "@type": "Question",
            "name": "Quels formats de fichiers sont supportés ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "ADJUJA accepte les fichiers PDF (natifs et scannés via OCR) ainsi que le texte brut. Le résultat est exportable en Word (.docx) ou PDF."
            }
          },
          {
            "@type": "Question",
            "name": "Le produit est-il adapté aux marchés publics marocains ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Oui, ADJUJA est conçu au Maroc et aligné sur le décret n°2-22-431 relatif aux marchés publics. La veille, l'analyse d'opportunité et la rédaction suivent le vocabulaire et les exigences du CPS marocain."
            }
          },
          {
            "@type": "Question",
            "name": "Mes données sont-elles sécurisées ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Oui. Vos documents restent votre propriété, ne sont jamais utilisés pour entraîner un modèle sans accord écrit, et sont supprimés sur demande. ADJUJA est conforme à la loi 09-08 sur la protection des données personnelles."
            }
          },
          {
            "@type": "Question",
            "name": "Y a-t-il un engagement minimum ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Non. ADJUJA est sans engagement, résiliable à tout moment. Un essai gratuit est disponible sans carte bancaire."
            }
          }
        ]
      }
    </script>

    <!-- Anti-flash : applique le thème avant le premier rendu -->
