# Redirige HTTP → HTTPS (offria.cloud)
# fahm.cloud inclus uniquement pour la validation du certificat Let's Encrypt
server {
    listen 80;
    server_name offria.cloud www.offria.cloud fahm.cloud www.fahm.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        if ($host ~* "fahm\.cloud") {
            return 444;  # Pas de redirection pour fahm.cloud — bloc à retirer après SSL généré
        }
        return 301 https://offria.cloud$request_uri;
    }
}

# HTTPS — fahm.cloud → proxy vers port 8443
server {
    listen 443 ssl;
    server_name fahm.cloud www.fahm.cloud;

    ssl_certificate /etc/letsencrypt/live/fahm.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fahm.cloud/privkey.pem;

    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_set_header Host fahm.cloud;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# HTTPS — offria.cloud
server {
    listen 443 ssl;
    server_name offria.cloud www.offria.cloud;

    ssl_certificate /etc/letsencrypt/live/offria.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/offria.cloud/privkey.pem;

    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API vers FastAPI
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /health {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # React Router — renvoie toujours index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
