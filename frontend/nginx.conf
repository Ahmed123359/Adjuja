# Redirige HTTP → HTTPS
server {
    listen 80;
    server_name offria.cloud www.offria.cloud;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    server_name offria.cloud www.offria.cloud;

    ssl_certificate /etc/letsencrypt/live/offria.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/offria.cloud/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API vers FastAPI
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /health {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # React Router — renvoie toujours index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
