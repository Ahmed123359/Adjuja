# docker-compose.dev.yml — surcharges pour le développement local
# Usage : docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       offria
      POSTGRES_USER:     offria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-offria_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offria"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-dev            # Saute le stage frontend-builder inutile en dev
    volumes:
      - ./app:/app/app           # Hot-reload : monte le code source Python en live
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      APP_ENV: development
      APP_DEBUG: "true"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules        # Volume anonyme pour isoler node_modules du host
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=http://api:8000
    depends_on:
      - api
    networks:
      - ao_network

volumes:
  postgres_data:

networks:
  ao_network:
